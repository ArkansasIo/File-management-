name: browser-client-tests
on:
  push:
  pull_request:
jobs:
  browser-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run browser client tests
        run: node --test tests/browser-client.test.mjs
